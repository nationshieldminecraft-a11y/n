<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NationRating</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #08080e;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 40px 20px 50px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #1f1f2b;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span {
            color: #555;
            font-weight: 400;
            font-size: 14px;
            background: #1a1a24;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* ================= ПИКСЕЛЬНАЯ МАТРИЦА (ВОЛНЫ) ================= */
        .hero-pixels {
            position: relative;
            width: 100%;
            height: 200px;
            background-color: #05050a;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }
        
        #pixelCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #05050a;
        }

        .hero-arrow {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            z-index: 10;
            transition: 0.3s;
        }
        .hero-arrow:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.5);
        }

        /* ================= ПАНЕЛЬ ФИЛЬТРОВ ================= */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .search-area { display: flex; align-items: center; }
        .search-input {
            background: #12121a;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 10px 18px;
            color: #fff;
            width: 200px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .search-input::placeholder { color: #555; }
        .search-input:focus { border-color: #4444ff; }
        
        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Базовый стиль кнопок */
        .filter-btn {
            background: transparent;
            border: 1px solid #2a2a35;
            padding: 8px 16px;
            border-radius: 20px;
            color: #888;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            font-family: inherit;
            user-select: none;
        }
        .filter-btn:hover { border-color: #444; color: #fff; }
        .filter-btn.active {
            border-color: #ff5533;
            color: #fff;
            background: rgba(255, 85, 51, 0.1);
        }

        /* Иконки */
        .icon-btn {
            background: #12121a;
            border: 1px solid #222;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            user-select: none;
            font-family: inherit;
        }
        .icon-btn:hover { border-color: #444; color: #fff; }
        .icon-btn.active {
            background: #253f99;
            border-color: #3b6bff;
            color: #fff;
        }

        /* Кнопки сбоку */
        .action-btn {
            background: #12121a;
            border: 1px solid #222;
            padding: 8px 16px;
            border-radius: 20px;
            color: #888;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            font-family: inherit;
            user-select: none;
        }
        .action-btn:hover { border-color: #444; color: #fff; }
        .action-btn.active {
            border-color: #555;
            color: #fff;
        }

        /* ================= МЕСТО ДЛЯ ИГРОКОВ ================= */
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .rating-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            min-height: 150px;
        }
        /* Карточка игрока (для примера, если появятся данные) */
        .player-card {
            background: #101016;
            border: 1px solid #1f1f2b;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }
        .player-card:hover { border-color: #333; }

        /* ================= МОДАЛЬНОЕ ОКНО ================= */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }

        .modal-window {
            background: #0e0e16;
            border: 1px solid #262630;
            border-radius: 24px;
            width: 100%;
            max-width: 750px;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
            cursor: default;
        }
        .modal-close {
            position: absolute;
            top: 20px; right: 25px;
            font-size: 24px;
            color: #666;
            cursor: pointer;
            transition: 0.2s;
            background: none;
            border: none;
        }
        .modal-close:hover { color: #fff; }

        .modal-top { display: flex; gap: 20px; margin-bottom: 20px; }
        .modal-avatar-wrapper { position: relative; width: 80px; height: 80px; }
        .modal-avatar {
            width: 100%; height: 100%;
            border-radius: 16px;
            background: #1a1a24;
            border: 2px solid #2a2a35;
        }
        .avatar-badges {
            position: absolute;
            bottom: -10px;
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: center;
        }
        .badge-btn {
            background: #1a1a24;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 4px 8px;
            color: #aaa;
            font-size: 12px;
        }
        .modal-info { flex-grow: 1; }
        .modal-nick {
            font-size: 28px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }
        .modal-nick svg { width: 18px; height: 18px; fill: #666; }
        .modal-aka-tags {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
        }
        .aka-tag {
            background: #181820; color: #aaa; font-size: 13px;
            padding: 4px 12px; border-radius: 30px; border: 1px solid #262630;
        }
        .aka-tag.add { border-style: dashed; color: #666; }
        .modal-rating-big { text-align: right; min-width: 80px; }
        .modal-rating-big h2 { color: #4d7aff; font-size: 38px; font-weight: 700; line-height: 1; }
        .modal-rating-big p { color: #666; font-size: 13px; margin-top: 5px; }

        .info-badge {
            background: #12121a; border: 1px solid #222; border-radius: 30px;
            padding: 10px 18px; font-size: 14px; color: #ccc; margin-bottom: 12px;
        }
        .info-badge span { color: #fff; font-weight: 500; }

        .stats-bar {
            background: #12121a; border: 1px solid #222; border-radius: 30px;
            padding: 12px 18px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px; font-size: 14px; flex-wrap: wrap; gap: 10px;
        }
        .stat-up { color: #4dff91; font-weight: 600; }
        .stat-down { color: #ff4d4d; font-weight: 600; }
        .stat-highlight { background: #1a1a24; padding: 2px 8px; border-radius: 12px; color: #fff; }

        .tabs-bar {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1f1f2b; padding-bottom: 10px; margin-bottom: 20px;
        }
        .tabs-left { display: flex; gap: 15px; }
        .tab-btn {
            background: transparent; border: 1px solid #2a2a35; color: #666;
            padding: 6px 14px; border-radius: 20px; font-size: 14px; cursor: pointer;
        }
        .tab-btn.active { border-color: #4444ff; color: #fff; background: rgba(68, 68, 255, 0.1); }
        .tabs-right { display: flex; gap: 10px; }
        .time-btn {
            background: transparent; border: none; color: #666; font-size: 13px; cursor: pointer;
        }
        .time-btn.active { color: #fff; border: 1px solid #4444ff; padding: 4px 12px; border-radius: 12px; }

        .chart-container {
            background: #111116; border-radius: 12px; height: 150px;
            position: relative; border: 1px solid #1f1f2b; overflow: hidden; padding: 10px;
        }
        .chart-data { position: relative; height: 100%; width: 100%; }
        .chart-curve {
            position: absolute; bottom: 20%; left: 10%; width: 80%; height: 50%;
            border-bottom: 2px solid #4d7aff; border-left: 2px solid #4d7aff;
            border-radius: 0 0 0 100px; box-shadow: 0 0 15px rgba(77, 122, 255, 0.2);
        }
        .chart-dot {
            position: absolute; right: -5px; bottom: -6px; width: 10px; height: 10px;
            background: #4d7aff; border-radius: 50%; box-shadow: 0 0 10px #4d7aff;
        }
        .chart-labels {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; color: #666; font-size: 12px;
        }

        @media (max-width: 992px) {
            .rating-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .rating-grid { grid-template-columns: 1fr; }
            .modal-top { flex-direction: column; align-items: flex-start; }
            .modal-rating-big { align-self: flex-end; margin-top: -80px; }
            .tabs-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
            .hero-pixels { height: 120px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="logo">NationRating <span>v1.0</span></div>
            <div></div>
        </header>

        <!-- ПИКСЕЛЬНАЯ МАТРИЦА -->
        <div class="hero-pixels" id="pixelHero">
            <canvas id="pixelCanvas"></canvas>
            <div class="hero-arrow">⌄</div>
        </div>

        <!-- Фильтры -->
        <div class="toolbar" id="mainToolbar">
            <div class="search-area">
                <input type="text" class="search-input" id="searchInput" placeholder="Найти на шкале">
            </div>
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="day">Топ дня</button>
                <button class="filter-btn" data-filter="week">Топ недели</button>
                
                <button class="icon-btn active" data-view="grid">▦</button>
                <button class="icon-btn" data-view="list">≡</button>
                
                <button class="action-btn" id="refreshBtn">↻ Обновить</button>
                <button class="action-btn active" id="autoBtn">● Авто</button>
                <button class="action-btn" id="addPlayerBtn">＋ Добавить игрока</button>
            </div>
        </div>

        <!-- Рейтинг -->
        <div class="section-title">Легенда сервера</div>
        <div class="rating-grid" id="ratingGrid">
            <!-- Сюда придут игроки с сервера -->
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="playerModal">
        <div class="modal-window">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-top">
                <div class="modal-avatar-wrapper">
                    <div class="modal-avatar" id="modalSkin"></div>
                    <div class="avatar-badges">
                        <div class="badge-btn">🖥</div>
                        <div class="badge-btn">✈</div>
                    </div>
                </div>
                <div class="modal-info">
                    <div class="modal-nick">Имя_Игрока <svg viewBox="0 0 24 24"><path d="M5 19h14v-2H5v2zm7-12.17l4.59 4.59L18 10l-6-6-6 6 1.41 1.41L12 6.83z"/></svg></div>
                    <div class="modal-aka-tags">
                        <span class="aka-tag">aka</span>
                        <span class="aka-tag">Тег 1</span>
                        <span class="aka-tag add">+ aka</span>
                    </div>
                </div>
                <div class="modal-rating-big">
                    <h2>+0.0</h2>
                    <p>· 0.0 за сутки</p>
                </div>
            </div>
            <div class="info-badge"><span>Легенда сервера №1</span> · Доп. информация</div>
            <div class="stats-bar">
                <div><span class="stat-up">↑0</span> <span class="stat-down">↓0</span></div>
                <div><span class="stat-highlight">0%</span> за</div>
                <div><span class="stat-highlight">0</span> голосов за неделю</div>
                <div>Охват <span class="stat-highlight">0%</span></div>
            </div>
            <div class="tabs-bar">
                <div class="tabs-left">
                    <button class="tab-btn active">Рейтинг</button>
                    <button class="tab-btn">Место</button>
                    <button class="tab-btn">Голоса</button>
                </div>
                <div class="tabs-right">
                    <button class="time-btn">24 часа</button>
                    <button class="time-btn active">Неделя</button>
                    <button class="time-btn">Месяц</button>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-labels"><span>легенда сервера</span><span>+0.0</span></div>
                <div class="chart-data">
                    <div class="chart-curve"><div class="chart-dot"></div></div>
                    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#333;font-size:12px;font-weight:600;letter-spacing:2px;">график активности</div>
                </div>
            </div>
        </div>
    </div>

    <!-- СКРИПТЫ -->
    <script>
        // ==========================================
        // 1. ЛОГИКА МОДАЛЬНОГО ОКНА
        // ==========================================
        function closeModal() {
            document.getElementById('playerModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        document.getElementById('playerModal').addEventListener('click', function(e) {
            // Закрываем, только если кликнули именно по темному фону, а не по окну
            if (e.target === this) closeModal();
        });

        // ==========================================
        // 2. ЛОГИКА РАБОТЫ КНОПОК
        // ==========================================
        
        function setupFilters() {
            // 2.1. Фильтры
            const filterBtns = document.querySelectorAll('.filter-btn[data-filter]');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    console.log(`Запрос на сервер: Фильтр ${this.textContent.trim()}`);
                    // ЗДЕСЬ ТЫ БУДЕШЬ ВЫЗЫВАТЬ fetch() К СВОЕМУ СЕРВЕРУ
                });
            });

            // 2.2. Вид (Сетка/Список)
            const viewBtns = document.querySelectorAll('.icon-btn[data-view]');
            viewBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    viewBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    console.log(`Изменен вид: ${this.textContent.trim() === '▦' ? 'Сетка' : 'Список'}`);
                });
            });

            // 2.3. Обновить
            document.getElementById('refreshBtn').addEventListener('click', function() {
                const originalText = this.innerHTML;
                this.innerHTML = '↻ Загрузка...';
                this.style.opacity = '0.7';
                
                // Имитация загрузки
                setTimeout(() => {
                    this.innerHTML = originalText;
                    this.style.opacity = '1';
                    console.log('Данные обновлены с сервера!');
                }, 800);
            });

            // 2.4. Авто
            document.getElementById('autoBtn').addEventListener('click', function() {
                this.classList.toggle('active');
                console.log(`Авто-обновление: ${this.classList.contains('active') ? 'Вкл' : 'Выкл'}`);
            });

            // 2.5. Поиск
            document.getElementById('searchInput').addEventListener('input', function() {
                console.log(`Поиск по запросу: ${this.value}`);
            });
        }
        
        setupFilters();


        // ==========================================
        // 3. ЛОГИКА ПИКСЕЛЬНЫХ ВОЛН
        // ==========================================
        const heroSection = document.getElementById('pixelHero');
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const cellSize = 18; 
        let cols, rows;
        
        let mouseX = -9999, mouseY = -9999; 

        function resizeCanvas() {
            const rect = heroSection.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            width = canvas.width;
            height = canvas.height;
            cols = Math.floor(width / cellSize);
            rows = Math.floor(height / cellSize);
        }

        heroSection.addEventListener('mousemove', (e) => {
            const rect = heroSection.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        
        heroSection.addEventListener('mouseleave', () => {
            mouseX = -9999; mouseY = -9999;
        });

        let waves = [];

        function animate() {
            ctx.clearRect(0, 0, width, height);

            if (mouseX > 0 && mouseY > 0 && mouseX < width && mouseY < height) {
                waves.push({
                    x: mouseX,
                    y: mouseY,
                    radius: 0,
                    maxRadius: 100
                });
            }

            for (let i = waves.length - 1; i >= 0; i--) {
                let wave = waves[i];
                wave.radius += 8;

                if (wave.radius > wave.maxRadius) {
                    waves.splice(i, 1);
                    continue;
                }

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const cellCenterX = x * cellSize + cellSize / 2;
                        const cellCenterY = y * cellSize + cellSize / 2;
                        
                        const dist = Math.sqrt(Math.pow(wave.x - cellCenterX, 2) + Math.pow(wave.y - cellCenterY, 2));
                        
                        const thickness = 15;
                        if (dist > wave.radius - thickness && dist < wave.radius) {
                            
                            const distFromRingCenter = Math.abs(dist - (wave.radius - thickness / 2));
                            const intensity = 1 - (distFromRingCenter / (thickness / 2));
                            
                            const r = 20;
                            const g = 60 + (120 * intensity); 
                            const b = 150 + (105 * intensity);
                            const alpha = 0.4 + (0.6 * intensity) * (1 - (wave.radius / wave.maxRadius));

                            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                            ctx.fillRect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1);
                        }
                    }
                }
            }

            const time = Date.now() / 3000;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const randomPhase = (Math.sin(x * 0.7 + y * 0.5 + time * 0.8) + 1) / 2;
                    if (randomPhase > 0.96) {
                        const bgAlpha = (randomPhase - 0.96) * 3;
                        ctx.fillStyle = `rgba(10, 30, 80, ${Math.min(0.2, bgAlpha)})`;
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1);
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animate();
    </script>

    <!-- ПОДКЛЮЧЕНИЕ К СЕРВЕРУ -->
    <script>
        // Адрес сервера: localhost, когда сайт открыт с ноутбука,
        // или постоянная публичная ссылка туннеля для GitHub Pages
        const API_BASE = "https://fed-exceed-two-dom.trycloudflare.com";

        function getApiUrl(path) {
            return API_BASE + "/api/" + path;
        }

        async function loadPlayers() {
            const grid = document.getElementById("ratingGrid");
            try {
                const res = await fetch(getApiUrl("players"));
                const players = await res.json();
                if (!Array.isArray(players) || players.length === 0) {
                    grid.innerHTML = '<div class="player-card">Пока нет игроков. Нажми «Добавить игрока».</div>';
                    return;
                }
                const sorted = [...players].sort((a, b) => (b.rating || 0) - (a.rating || 0));
                grid.innerHTML = sorted.map((p) => {
                    const nick = p.nick || "Без имени";
                    const skin = getSkinUrl(nick);
                    return `
                    <div class="player-card" data-id="${p.id}" data-nick="${escapeHtml(nick)}" data-rating="${p.rating ?? 0}">
                        <div style="width:50px;height:50px;flex-shrink:0;border-radius:10px;overflow:hidden;background:#1a1a24;border:2px solid #2a2a35;">
                            <img src="${skin}" alt="${escapeHtml(nick)}" style="width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated;">
                        </div>
                        <div style="flex-grow:1;">
                            <div style="font-weight:700;font-size:16px;">${escapeHtml(nick)}</div>
                            <div style="color:#888;font-size:13px;margin-top:4px;">
                                <span style="color:#4d7aff;font-weight:600;">${p.rating ?? 0}</span> · добавлен ${new Date(p.createdAt).toLocaleDateString()}
                            </div>
                        </div>
                    </div>`;
                }).join("");

                grid.querySelectorAll(".player-card").forEach((card) => {
                    card.style.cursor = "pointer";
                    card.addEventListener("click", () => {
                        const nick = card.dataset.nick;
                        const rating = Number(card.dataset.rating);
                        openPlayerModal(nick, rating);
                    });
                });
            } catch (err) {
                grid.innerHTML = '<div class="player-card">Не удалось связаться с сервером. Проверь, что туннель запущен.</div>';
            }
        }

        function getSkinUrl(nick) {
            return "https://minotar.net/helm/" + encodeURIComponent(nick) + "/100";
        }

        function getBodySkinUrl(nick) {
            return "https://minotar.net/body/" + encodeURIComponent(nick) + "/200";
        }

        let lastClicked = null;

        function openPlayerModal(nick, rating) {
            const modal = document.getElementById("playerModal");
            const skin = document.getElementById("modalSkin");
            skin.innerHTML = '<img src="' + getSkinUrl(nick) + '" alt="' + escapeHtml(nick) + '" style="width:100%;height:100%;border-radius:14px;object-fit:cover;image-rendering:pixelated;">';
            document.querySelector("#playerModal .modal-nick").childNodes[0].nodeValue = " " + nick + " ";
            document.querySelector("#playerModal .modal-rating-big h2").textContent = "+" + (rating ?? 0);
            modal.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (c) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
            }[c]));
        }

        document.getElementById("addPlayerBtn").addEventListener("click", async () => {
            const nick = prompt("Ник игрока:");
            if (!nick || !nick.trim()) return;
            const res = await fetch(getApiUrl("players"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nick: nick.trim(), rating: 1000 }),
            });
            if (res.ok) {
                loadPlayers();
            } else {
                alert("Ошибка сохранения игрока.");
            }
        });

        document.getElementById("refreshBtn").addEventListener("click", function () {
            const originalText = this.innerHTML;
            this.innerHTML = "↻ Загрузка...";
            this.style.opacity = "0.7";
            setTimeout(() => {
                this.innerHTML = originalText;
                this.style.opacity = "1";
            }, 300);
            loadPlayers();
        });

        loadPlayers();
    </script>
</body>
</html>
